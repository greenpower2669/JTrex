name: Publish June T-Rex 1.0.15 main

on:
  push:
    branches:
      - port/android-first-apk
    paths:
      - .github/workflows/publish-junetrex-main-1.0.15.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated main APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 37203568079 \
            --repo "$GITHUB_REPOSITORY" \
            --name "JuneT-Rex-1.0.15-debug" \
            --dir dist

      - name: Verify exact main APK
        run: |
          set -euo pipefail
          test -f dist/JuneT-Rex-1.0.15-debug.apk
          printf '%s  %s\n' \
            '2fbad1d19084fa7ad2c00ac81156ef0c5db0c933b679075df3ddf7fbb5f330b1' \
            'dist/JuneT-Rex-1.0.15-debug.apk' | sha256sum -c -
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.0.15-main \
            dist/JuneT-Rex-1.0.15-debug.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target a2efd10a8f508c301156879ac1ab534f1a9d06ca \
            --title "June T-Rex 1.0.15 — main" \
            --notes-file - <<'EOF'
          Main release after merging the Android port and consolidating living memories.

          - main merge commit: a2efd10a8f508c301156879ac1ab534f1a9d06ca
          - PR #1 merged
          - media inspection #24: success
          - Android build #76: success
          - exact build #76 APK attached
          - living memories compacted; full previous history archived losslessly under archive/memories/2026-10-04-pre-main-merge/
          - gameplay canon unchanged: KO, rounds, power costs, orb timing, beach wait loop preserved

          APK SHA-256: 2fbad1d19084fa7ad2c00ac81156ef0c5db0c933b679075df3ddf7fbb5f330b1
          EOF
