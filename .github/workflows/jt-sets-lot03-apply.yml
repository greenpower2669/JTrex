name: Dispatch JT-SETS-001 Lot03 Android

on:
  push:
    branches:
      - tmp-jt-sets-lot03-fixture-run
    paths:
      - '.github/workflows/jt-sets-lot03-apply.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Android validation on feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/dispatches" \
            -d '{"ref":"feature/dinosaur-sets-v1"}'
          echo 'ANDROID_DISPATCHED=feature/dinosaur-sets-v1'
