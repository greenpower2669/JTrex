name: Publish June T-Rex 1.0.15

on:
  push:
    branches:
      - port/android-first-apk
    paths:
      - .github/workflows/publish-junetrex-1.0.15.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated APK artifact from run 75
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 37190720935 \
            --repo "$GITHUB_REPOSITORY" \
            --name "JuneT-Rex-1.0.15-debug" \
            --dir dist

      - name: Verify exact APK before publishing
        run: |
          set -euo pipefail
          test -f dist/JuneT-Rex-1.0.15-debug.apk
          printf '%s  %s\n' \
            '54f5490ccf346b3e80e3117b4cf020b24898ad89cb44e6a2bd6bf73051d99c11' \
            'dist/JuneT-Rex-1.0.15-debug.apk' | sha256sum -c -
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.0.15 \
            dist/JuneT-Rex-1.0.15-debug.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target ed1842bae1176ffb08d76905b597a548c7ecf382 \
            --title "June T-Rex 1.0.15 — Android" \
            --notes-file - <<'EOF'
          Android test release built from the validated functional candidate.

          - Orb beach loop replaces the former back-and-forth wait media.
          - Every genuinely new orb exchange starts with a fresh 10-second window.
          - Returning from a power preserves the remaining orb time.
          - A true new round after KO resets ST/TR energy to 0.
          - Existing KO / two-round-win canon and power costs are preserved.

          Build: GitHub Actions run #75
          Functional commit: ed1842bae1176ffb08d76905b597a548c7ecf382
          APK SHA-256: 54f5490ccf346b3e80e3117b4cf020b24898ad89cb44e6a2bd6bf73051d99c11
          EOF
