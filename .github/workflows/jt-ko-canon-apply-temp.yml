name: Apply JT KO canon

on:
  push:
    branches:
      - port/android-first-apk
    paths:
      - .github/workflows/jt-ko-canon-apply-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: port/android-first-apk
          fetch-depth: 0

      - name: Apply KO canonical patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/scripts/jt-ko-patch.gz.b64 | gzip -d > /tmp/apply_jt_ko_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_jt_ko_patch.py')
          text = path.read_text(encoding='utf-8')
          rewrites = {
              "pi = replace_once(pi, \"                h = Harness(); h.state(state); h.frame()\\n\", \"                h = Harness(); h.state(state); h.finish_start(); h.frame()\\n\", 'gauge family setup')":
                  "pi = pi.replace(\"                h = Harness(); h.state(state); h.frame()\\n\", \"                h = Harness(); h.state(state); h.finish_start(); h.frame()\\n\")",
              "pi = replace_once(pi, \"                h = Harness(); h.state(state); h.frame()\\n\", \"                h = Harness(); h.state(state); h.finish_start(); h.frame()\\n\", 'decisive gauge setup')":
                  "# decisive gauge setup already covered by the previous replacement",
          }
          for old, new in rewrites.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'helper rewrite expected once, found {count}: {old[:80]}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python3 /tmp/apply_jt_ko_patch.py
          python3 - <<'PY'
          import importlib.util
          import re
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('prep', 'tools/prepare_android.py')
          prep = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(prep)

          path = Path('buildozer.spec')
          text = path.read_text(encoding='utf-8')
          text, c1 = re.subn(r'(?m)^version\s*=\s*[^\n]+$', f'version = {prep.VERSION}', text, count=1)
          text, c2 = re.subn(r'(?m)^android\.numeric_version\s*=\s*[^\n]+$', f'android.numeric_version = {prep.NUMERIC_VERSION}', text, count=1)
          if (c1, c2) != (1, 1):
              raise SystemExit(f'buildozer version rewrite failed: {(c1, c2)}')
          path.write_text(text, encoding='utf-8')
          print(f'[JT-KO] buildozer aligned to {prep.VERSION}/{prep.NUMERIC_VERSION}')

          test_path = Path('tests/test_round_ko_contract.py')
          test_text = test_path.read_text(encoding='utf-8')
          old = "self.assertFalse(any(h.ns['selected'][1:7]))"
          new = "self.assertFalse(any(h.ns['selected'][i] for i in range(1, 7)))"
          count = test_text.count(old)
          if count != 1:
              raise SystemExit(f'selected reset test rewrite expected once, found {count}')
          test_path.write_text(test_text.replace(old, new), encoding='utf-8')
          print('[JT-KO] selected reset assertion aligned with generated dict')
          PY

      - name: Prepare generated historical engine
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/JuneTrex.zip \
            'https://github.com/greenpower2669/JTrex/releases/download/JTrex/JuneTrex.zip'
          cp buildozer.spec /tmp/jt-buildozer.spec
          python3 tools/prepare_android.py \
            --archive /tmp/JuneTrex.zip \
            --output /tmp/jt-app \
            --spec /tmp/jt-buildozer.spec

      - name: Run deterministic generated-engine tests
        shell: bash
        run: |
          set -euo pipefail
          JT_GENERATED_MAIN=/tmp/jt-app/main.py \
            python3 -W ignore::SyntaxWarning -m unittest discover -s tests -v 2>&1 | tee /tmp/jt-tests.log
          grep -E 'Ran [0-9]+ tests' /tmp/jt-tests.log | tail -1

      - name: Record verification and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          ran=$(grep -E 'Ran [0-9]+ tests' /tmp/jt-tests.log | tail -1 || true)
          printf '\nDeterministic verification: GREEN — %s — helper run %s.\n' "$ran" "$GITHUB_RUN_ID" >> diagnostics/JT-ROUNDS-KO-CANON-001.md
          git rm -- 'assets/powers/trph-phoenix-attacka sipprimer.mp4'
          git rm -- '.github/scripts/jt-ko-patch.gz.b64'
          git rm -- '.github/workflows/jt-ko-canon-apply-temp.yml'

      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'greenpower2669'
          git config user.email '80179295+greenpower2669@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'fix: implement KO-based rounds canon'
          git push origin HEAD:port/android-first-apk
