name: JT-SETS-001 Lot01 Diagnostic

on:
  push:
    branches:
      - feature/dinosaur-sets-v1
    paths:
      - '.github/workflows/jt-sets-lot01-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify mission base
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git rev-parse HEAD | tee head.txt
          git merge-base --is-ancestor ce858fe57b395c2a52967dc0e8acdd92ff6aa81e HEAD

      - name: Download canonical archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output JuneTrex.zip \
            'https://github.com/greenpower2669/JTrex/releases/download/JTrex/JuneTrex.zip'
          test -s JuneTrex.zip
          stat -c%s JuneTrex.zip | tee archive-size.txt
          sha256sum JuneTrex.zip | tee archive-sha256.txt
          test "$(stat -c%s JuneTrex.zip)" = 327992765
          echo 'f73ca1fd5e96ca6e11df5987bda8b2e59ebac26b1beb23fe34883b15bee66647  JuneTrex.zip' | sha256sum -c -

      - name: Generate canonical Android source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          mkdir -p diagnostics
          python3 tools/prepare_android.py \
            --archive JuneTrex.zip \
            --output app \
            --spec buildozer.spec \
            2>&1 | tee diagnostics/jt-sets-001-lot01-prepare.log
          sha256sum app/main.py | tee generated-main-sha256.txt

      - name: Run full baseline tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee baseline-tests.log

      - name: Produce read-only inventory probes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('app/main.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          patterns = (
              'namea', 'longanim1', 'genrea', 'sona',
              'def affbt', 'self.b1', 'self.b2', 'self.b3', 'self.b4', 'self.b5', 'self.b6',
              'indexa==21', 'indexa==22', 'indexa==23', 'indexa==24', 'indexa==25', 'indexa==26',
              'indexa=21', 'indexa=22', 'indexa=23', 'indexa=24', 'indexa=25', 'indexa=26',
              'deg', 'degg', 'degd', 'stamg', 'stamd', 'pvg', 'pvd', 'anim1', 'longanim1'
          )
          hit_lines = []
          for i, line in enumerate(lines, 1):
              if any(x in line for x in patterns):
                  hit_lines.append(i)
          merged=[]
          for i in hit_lines:
              a=max(1,i-4); b=min(len(lines),i+8)
              if merged and a <= merged[-1][1] + 1:
                  merged[-1]=(merged[-1][0], max(merged[-1][1], b))
              else:
                  merged.append((a,b))
          out=[]
          for a,b in merged:
              out.append(f'===== lines {a}-{b} =====')
              out.extend(f'{n:05d}: {lines[n-1]}' for n in range(a,b+1))
          Path('generated-main-probe.txt').write_text('\n'.join(out)+'\n', encoding='utf-8')

          mapping={1:21,2:22,3:23,4:24,5:25,6:26}
          text='\n'.join(lines)
          evidence={}
          for slot,state in mapping.items():
              evidence[str(slot)]={
                  'state':state,
                  'launch_token_present': f'indexa={state}' in text,
                  'cost_token_present': f'POWER_COSTS[{slot}]' in text,
                  'widget_source_mentions': [
                      {'line':i,'text':line.strip()} for i,line in enumerate(lines,1)
                      if f'self.b{slot}.source' in line or f'self.b{slot}s.source' in line
                  ],
              }
          Path('slot-mapping.json').write_text(json.dumps(evidence,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY

      - name: Upload Lot01 evidence
        uses: actions/upload-artifact@v4
        with:
          name: JT-SETS-001-Lot01-Evidence
          retention-days: 7
          path: |
            head.txt
            archive-size.txt
            archive-sha256.txt
            generated-main-sha256.txt
            diagnostics/jt-sets-001-lot01-prepare.log
            baseline-tests.log
            generated-main-probe.txt
            slot-mapping.json
            app/main.py
            app/android-preparation.json
