name: JT-SETS-001 Lot01 Diagnostic

on:
  push:
    branches:
      - feature/dinosaur-sets-v1
    paths:
      - '.github/workflows/jt-sets-lot01-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify mission base
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git rev-parse HEAD | tee head.txt
          git merge-base --is-ancestor ce858fe57b395c2a52967dc0e8acdd92ff6aa81e HEAD

      - name: Download canonical archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output JuneTrex.zip \
            'https://github.com/greenpower2669/JTrex/releases/download/JTrex/JuneTrex.zip'
          test -s JuneTrex.zip
          stat -c%s JuneTrex.zip | tee archive-size.txt
          sha256sum JuneTrex.zip | tee archive-sha256.txt
          test "$(stat -c%s JuneTrex.zip)" = 327992765
          echo 'f73ca1fd5e96ca6e11df5987bda8b2e59ebac26b1beb23fe34883b15bee66647  JuneTrex.zip' | sha256sum -c -

      - name: Generate canonical Android source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          mkdir -p diagnostics
          python3 tools/prepare_android.py \
            --archive JuneTrex.zip \
            --output app \
            --spec buildozer.spec \
            2>&1 | tee diagnostics/jt-sets-001-lot01-prepare.log
          sha256sum app/main.py | tee generated-main-sha256.txt

      - name: Run full baseline tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee baseline-tests.log

      - name: Produce read-only inventory probes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          p = Path('app/main.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          text='\n'.join(lines)
          patterns = (
              'namea', 'longanim1', 'genrea', 'sona',
              'def affbt', 'self.b1', 'self.b2', 'self.b3', 'self.b4', 'self.b5', 'self.b6',
              'indexa==21', 'indexa==22', 'indexa==23', 'indexa==24', 'indexa==25', 'indexa==26',
              'indexa=21', 'indexa=22', 'indexa=23', 'indexa=24', 'indexa=25', 'indexa=26',
              'deg', 'degg', 'degd', 'stamg', 'stamd', 'pvg', 'pvd', 'anim1', 'longanim1'
          )
          hit_lines = [i for i,line in enumerate(lines,1) if any(x in line for x in patterns)]
          merged=[]
          for i in hit_lines:
              a=max(1,i-4); b=min(len(lines),i+8)
              if merged and a <= merged[-1][1] + 1:
                  merged[-1]=(merged[-1][0], max(merged[-1][1], b))
              else:
                  merged.append((a,b))
          out=[]
          for a,b in merged:
              out.append(f'===== lines {a}-{b} =====')
              out.extend(f'{n:05d}: {lines[n-1]}' for n in range(a,b+1))
          Path('generated-main-probe.txt').write_text('\n'.join(out)+'\n', encoding='utf-8')

          mapping={1:21,2:22,3:23,4:24,5:25,6:26}
          evidence={}
          for slot,state in mapping.items():
              evidence[str(slot)]={
                  'state':state,
                  'launch_token_present': f'indexa={state}' in text,
                  'cost_token_present': f'POWER_COSTS[{slot}]' in text,
                  'widget_source_mentions': [
                      {'line':i,'text':line.strip()} for i,line in enumerate(lines,1)
                      if f'self.b{slot}.source' in line or f'self.b{slot}s.source' in line
                  ],
              }
          Path('slot-mapping.json').write_text(json.dumps(evidence,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          state_meta={}
          for state in range(21,27):
              meta={'state':state}
              for key in ('longanim1','namea','genrea','deg','sona'):
                  rx=re.compile(rf"^{key}\[{state}\]=(.*)$")
                  for i,line in enumerate(lines,1):
                      m=rx.match(line.strip())
                      if m:
                          meta[key]={'line':i,'expr':m.group(1)}
                          break
              trigger=meta.get('deg',{}).get('expr')
              try:
                  trigger_int=int(trigger) if trigger is not None else None
              except ValueError:
                  trigger_int=None
              if trigger_int is not None:
                  for i,line in enumerate(lines,1):
                      if line.strip()==f'if anim1=={trigger_int}:':
                          block=[]
                          for n in range(i, min(i+5,len(lines)+1)):
                              block.append({'line':n,'text':lines[n-1].strip()})
                          meta['effect_block']=block
                          break
              state_meta[str(state)]=meta
          Path('power-effects.json').write_text(json.dumps(state_meta,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          candidates=[
              'assets/intro/JTrexintro1.mp4','assets/intro/JTrexintro2.mp4','assets/intro/JTrexintro3.mp4',
              'assets/combat/StegTrexPlageVideoenboucledesorbes.mp4',
              'assets/combat/Chargestegtrexchargerougebleucorrected.mp4',
              'assets/combat/Stegtrexegalitechargeboutonjaune.mp4',
              'assets/combat/Zerowinstegtrexsurleschargedejaugejauneetbleuetrouge.mp4',
              'assets/combat/Stegtrexresultstegwin.mp4','assets/combat/Stegtrexresulttrexwin.mp4',
              'assets/powers/stsf-sanctuary-force.mp4','assets/powers/stls-lifestream.mp4','assets/powers/stta-tornado-attack.mp4',
              'assets/powers/trfs-fire-storm.mp4','assets/powers/trph-phoenix-attack.mp4','assets/powers/trma-meteor-attack.mp4',
              'assets/finishing/steg-finishing-trex.mp4','assets/finishing/trex-finishing-steg.mp4',
          ]
          generated=[
              'stsf0.png','stsf1.png','sth0.png','sth1.png','stta0.png','stta1.png',
              'trfs0.png','trfs1.png','trph0.png','trph1.png','trma0.png','trma1.png',
              'sf.wav','ls.wav','ta.wav','fs.wav','ph.wav','ma.wav',
              'stsf.wav','stls.wav','stta.wav','trfs.wav','trph.wav','trma.wav',
          ]
          hashes=[]
          for rel in candidates:
              path=Path(rel)
              if path.is_file():
                  data=path.read_bytes()
                  hashes.append({'role':'repo','path':rel,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              else:
                  hashes.append({'role':'repo','path':rel,'missing':True})
          for rel in generated:
              path=Path('app')/rel
              if path.is_file():
                  data=path.read_bytes()
                  hashes.append({'role':'generated','path':rel,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              else:
                  hashes.append({'role':'generated','path':rel,'missing':True})
          Path('set-asset-hashes.json').write_text(json.dumps(hashes,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY

      - name: Upload Lot01 evidence
        uses: actions/upload-artifact@v4
        with:
          name: JT-SETS-001-Lot01-Evidence
          retention-days: 7
          path: |
            head.txt
            archive-size.txt
            archive-sha256.txt
            generated-main-sha256.txt
            diagnostics/jt-sets-001-lot01-prepare.log
            baseline-tests.log
            generated-main-probe.txt
            slot-mapping.json
            power-effects.json
            set-asset-hashes.json
            app/main.py
            app/android-preparation.json
