name: Build June T-Rex APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'buildozer.spec'
      - 'tools/prepare_android.py'
      - 'tools/jtrex_media_runtime.py'
      - 'tools/p4a-ffmpeg-6.1.2.py'
      - 'tools/patches/p4a-venv-clear.patch'
      - 'tools/patches/p4a-python312-grp-api21.patch'
      - 'tools/patches/p4a-python312-bootstrap-exception-diag.patch'
      - 'tools/patches/p4a-python312-libpython-global.patch'
      - 'assets/**'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-android:
    if: github.event_name != 'release' || github.event.release.tag_name == 'JTrex'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Download fixed historical archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output JuneTrex.zip \
            'https://github.com/greenpower2669/JTrex/releases/download/JTrex/JuneTrex.zip'
          test -s JuneTrex.zip

      - name: Verify and prepare JuneTrex sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_android.py \
            --archive JuneTrex.zip \
            --output app \
            --spec buildozer.spec \
            2>&1 | tee preparation.log

      - name: Inspect historical integration hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > main-hooks.txt
          from pathlib import Path

          path = Path("app/main.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          markers = (
              "def on_touch_down",
              "def mc1",
              "def anim_1",
              "def on_start",
              "namea",
              "longanim1",
              "genrea",
              "sona",
              "indexa=",
              "indexa =",
              "jtrm0.wav",
              "Clock.schedule_interval",
          )
          hits = []
          for i, line in enumerate(lines):
              if any(marker in line for marker in markers):
                  hits.append(i)

          emitted = set()
          for i in hits:
              start = max(0, i - 8)
              end = min(len(lines), i + 18)
              key = (start, end)
              if key in emitted:
                  continue
              emitted.add(key)
              print(f"===== lines {start + 1}-{end} =====")
              for n in range(start, end):
                  print(f"{n + 1:05d}: {lines[n]}")
          PY

      - name: Validate media, power and score adaptation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path("app/main.py").read_text(encoding="utf-8")
          runtime = Path("app/jtrex_media_runtime.py").read_text(encoding="utf-8")

          required_main = (
              "POWER_COSTS={1:60,2:40,3:60,4:60,5:60,6:80}",
              "def jt_power_available(slot):",
              "energy>POWER_COSTS[slot]",
              "jt_power_available(i)",
              "[JT-POWER]",
              "[JT-SCORE][STOP]",
              "[JT-SCORE][FINAL]",
              "[JT-SCORE][LETTER]",
              "media_controller.sync_scene_state(indexa)",
              "_jt_scene_video_active",
          )
          for token in required_main:
              if token not in main:
                  raise SystemExit(f"missing generated main token: {token}")

          forbidden_main = (
              "stamg>60 and select[i]",
              "stamd>60 and select[i]",
              "stamg-=60;selected[",
              "stamd-=60;selected[",
              "and select[i] and not selected[i]",
              "and bonus[1] and collide",
              "and bonus[2] and collide",
              "and bonus[3] and collide",
              "and bonus[4] and collide",
              "and bonus[5] and collide",
              "and bonus[6] and collide",
              "babokpbd=False",
          )
          for token in forbidden_main:
              if token in main:
                  raise SystemExit(f"stale power rule remains: {token}")

          required_runtime = (
              "StegVsTrexvaetviensremolacebisorigune.mp4",
              "Chargestegtrexchargerougebleu.mp4",
              "Stegtrexegalitechargeboutonjaune.mp4",
              "Stegtrexresultstegwin.mp4",
              "Stegtrexresulttrexwin.mp4",
              "scale = max(",
              'eos_policy = "loop" if scene["loop"] else "pause"',
          )
          for token in required_runtime:
              if token not in runtime:
                  raise SystemExit(f"missing runtime token: {token}")

          compile(main, "app/main.py", "exec")
          compile(runtime, "app/jtrex_media_runtime.py", "exec")
          print("JT validation: generated Python compiles and canonical markers are present")
          PY

      - name: Install Buildozer system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            python3-venv \
            autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            automake autopoint gettext ffmpeg
          java -version
          python3 --version

      - name: Inspect JTrex media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media-inspection
          : > media-inspection/media-inspection.txt

          inspect_video() {
            src="$1"
            stem="$2"
            echo "===== $src =====" | tee -a media-inspection/media-inspection.txt
            sha256sum "$src" | tee -a media-inspection/media-inspection.txt
            ffprobe -v error \
              -show_entries format=filename,duration,size,bit_rate \
              -show_entries stream=index,codec_name,codec_type,width,height,sample_aspect_ratio,display_aspect_ratio,r_frame_rate,avg_frame_rate,sample_rate,channels:stream_tags=rotate:stream_side_data=rotation \
              -of json "$src" | tee -a media-inspection/media-inspection.txt

            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$src")"
            middle="$(python3 -c 'import sys; print(max(0.0, float(sys.argv[1]) / 2.0))' "$duration")"

            ffmpeg -y -v error -ss 0 -i "$src" -frames:v 1 "media-inspection/$stem-first.png"
            ffmpeg -y -v error -ss "$middle" -i "$src" -frames:v 1 "media-inspection/$stem-middle.png"
            ffmpeg -y -v error -sseof -0.10 -i "$src" -frames:v 1 "media-inspection/$stem-last.png"
          }

          inspect_video assets/intro/JTrexintro1.mp4 intro1
          inspect_video assets/intro/JTrexintro2.mp4 intro2
          inspect_video assets/intro/JTrexintro3.mp4 intro3
          inspect_video assets/combat/Chargestegtrexchargerougebleu.mp4 scene-15-charge
          inspect_video assets/combat/Stegtrexegalitechargeboutonjaune.mp4 scene-16-yellow
          inspect_video assets/combat/StegVsTrexvaetviensremolacebisorigune.mp4 scene-20-wait
          inspect_video assets/combat/Stegtrexresultstegwin.mp4 scene-60-st-win
          inspect_video assets/combat/Stegtrexresulttrexwin.mp4 scene-61-tr-win

          echo "===== assets/icon/JtrexIcon.png =====" | tee -a media-inspection/media-inspection.txt
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height -of json \
            assets/icon/JtrexIcon.png | tee -a media-inspection/media-inspection.txt
          cp assets/icon/JtrexIcon.png media-inspection/JtrexIcon.png

      - name: Install Buildozer and record Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip wheel
          python -m pip install git+https://github.com/kivy/buildozer
          python -m pip install setuptools cython==0.29.34
          buildozer --version
          python -m pip freeze | sort | tee toolchain.txt

      - name: Prepare pinned patched python-for-android
        shell: bash
        run: |
          set -euo pipefail
          P4A_DIR="app/.buildozer/android/platform/python-for-android"
          rm -rf "$P4A_DIR"
          mkdir -p "$(dirname "$P4A_DIR")"
          git clone --branch master --single-branch \
            https://github.com/kivy/python-for-android.git "$P4A_DIR"
          git -C "$P4A_DIR" reset --hard \
            58d21141f17c889bf8585f5665921d72028f8831
          test "$(git -C "$P4A_DIR" rev-parse HEAD)" = \
            "58d21141f17c889bf8585f5665921d72028f8831"
          git -C "$P4A_DIR" apply --check \
            "$GITHUB_WORKSPACE/tools/patches/p4a-venv-clear.patch"
          git -C "$P4A_DIR" apply \
            "$GITHUB_WORKSPACE/tools/patches/p4a-venv-clear.patch"
          git -C "$P4A_DIR" apply --check \
            "$GITHUB_WORKSPACE/tools/patches/p4a-python312-grp-api21.patch"
          git -C "$P4A_DIR" apply \
            "$GITHUB_WORKSPACE/tools/patches/p4a-python312-grp-api21.patch"
          git -C "$P4A_DIR" apply --check \
            "$GITHUB_WORKSPACE/tools/patches/p4a-python312-bootstrap-exception-diag.patch"
          git -C "$P4A_DIR" apply \
            "$GITHUB_WORKSPACE/tools/patches/p4a-python312-bootstrap-exception-diag.patch"
          git -C "$P4A_DIR" apply --check \
            "$GITHUB_WORKSPACE/tools/patches/p4a-python312-libpython-global.patch"
          git -C "$P4A_DIR" apply \
            "$GITHUB_WORKSPACE/tools/patches/p4a-python312-libpython-global.patch"
          cp "$GITHUB_WORKSPACE/tools/p4a-ffmpeg-6.1.2.py" \
            "$P4A_DIR/pythonforandroid/recipes/ffmpeg/__init__.py"
          echo "ffmpeg_recipe_source=p4a@541fe992ea86b3902f0e0f776167555da6dbca01" \
            >> p4a-patch.txt
          echo "p4a_base=$(git -C "$P4A_DIR" rev-parse HEAD)" | tee p4a-patch.txt
          echo "p4a_branch=$(git -C "$P4A_DIR" branch --show-current)" | tee -a p4a-patch.txt
          echo "===== EFFECTIVE P4A DIFF =====" | tee -a p4a-patch.txt
          git -C "$P4A_DIR" diff --check
          git -C "$P4A_DIR" diff | tee -a p4a-patch.txt

      - name: Build debug APK
        working-directory: app
        shell: bash
        run: |
          set -uo pipefail
          . ../.venv/bin/activate
          export VERSION_hostpython3=3.11.13
          echo "VERSION_hostpython3=$VERSION_hostpython3" | tee -a ../toolchain.txt
          python --version
          java -version
          buildozer --version
          set +e
          buildozer -v android debug 2>&1 | tee ../buildozer.log
          STATUS=${PIPESTATUS[0]}
          set -e
          tail -n 300 ../buildozer.log || true
          echo "buildozer_exit_code=$STATUS"
          exit "$STATUS"

      - name: Record python-for-android revision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for directory in \
            app/.buildozer/android/platform/python-for-android \
            "$HOME/.buildozer/android/platform/python-for-android"
          do
            if [ -d "$directory/.git" ]; then
              revision=$(git -C "$directory" rev-parse HEAD)
              echo "python-for-android=$revision" >> toolchain.txt
            fi
          done

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/bin/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Un APK attendu, ${#apks[@]} trouvé(s)." >&2
            exit 1
          fi
          mkdir -p artifacts
          cp "${apks[0]}" artifacts/JuneT-Rex-1.0.3-debug.apk
          cd artifacts
          sha256sum JuneT-Rex-1.0.3-debug.apk > SHA256SUMS.txt

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JuneTrex-Android-Diagnostics
          path: |
            preparation.log
            buildozer.log
            toolchain.txt
            p4a-patch.txt
            main-hooks.txt
            media-inspection/
            app/android-preparation.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JuneT-Rex-1.0.3-debug
          path: |
            artifacts/JuneT-Rex-1.0.3-debug.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
