name: Build June T-Rex APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Download JuneTrex.zip from published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_URL=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | jq -r '.assets[] | select(.name == "JuneTrex.zip") | .url' \
            | head -n 1)
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "JuneTrex.zip introuvable dans la dernière Release publiée" >&2
            exit 1
          fi
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" -o JuneTrex.zip
          test -s JuneTrex.zip
          ls -lh JuneTrex.zip

      - name: Prepare game sources
        run: |
          set -euo pipefail
          rm -rf payload app
          mkdir -p payload app
          unzip -q JuneTrex.zip -d payload
          MAIN=$(find payload -type f -name main.py -print -quit)
          if [ -z "$MAIN" ]; then
            echo "main.py introuvable dans JuneTrex.zip" >&2
            exit 1
          fi
          ROOT=$(dirname "$MAIN")
          echo "Racine du jeu: $ROOT"
          rsync -a "$ROOT"/ app/
          cp buildozer.spec app/buildozer.spec
          test -f app/main.py
          du -sh app

      - name: Install Buildozer system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            automake autopoint gettext
          java -version
          python3 --version

      - name: Install Buildozer
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip wheel
          python -m pip install git+https://github.com/kivy/buildozer
          python -m pip install setuptools cython==0.29.34
          buildozer --version

      - name: Build APK with Buildozer
        working-directory: app
        run: |
          set -euo pipefail
          . ../.venv/bin/activate
          yes | buildozer -v android debug

      - name: Show APK
        if: success()
        run: |
          find app/bin -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JuneTrex-APK
          path: app/bin/*.apk
          if-no-files-found: error
          compression-level: 0
