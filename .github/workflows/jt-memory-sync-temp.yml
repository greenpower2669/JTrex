name: JT temporary memory sync

on:
  push:
    branches:
      - port/android-first-apk
    paths:
      - '.github/workflows/jt-memory-sync-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    if: "${{ github.event.head_commit.message == 'chore: fix JT memory sync helper guard' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/android-first-apk
          fetch-depth: 0

      - name: Append JT-GAUGES-VERDICT-001 to living memories
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sections = {
            'brain.md': r'''

## 2026-10-03 — JT-GAUGES-VERDICT-001 — restitution des verdicts après jauges

Cause et comportement canonique confirmés sur la branche `port/android-first-apk` : les confrontations rouge/bleu (2/3/4) et jaune (5/6/7) décident déjà leur vainqueur et appliquent leurs conséquences dans le moteur historique, puis leur séquence se termine en `indexa=1`. Le contrôleur de présentation 1.0.12 interprétait immédiatement ce `1` comme attente / PRE_ROUND ; le petit verdict visuel ST/TR était donc escamoté.

Il ne faut pas faire entrer réellement le moteur dans 8/9 pour réparer ce défaut : les états historiques 8/9 portent leurs propres impacts issus du score des orbes et leur réutilisation logique après une jauge risquerait d'appliquer une conséquence une seconde fois. Le correctif conserve donc le moteur comme seule autorité et utilise 8/9 uniquement comme identifiants de présentation du média de verdict après une jauge décisive.

Mapping de présentation : état décisif 3 (rouge/bleu ST) -> média verdict ST 8 ; état 2 (rouge/bleu TR) -> média verdict TR 9 ; état 5 (jaune ST) -> média verdict ST 8 ; état 6 (jaune TR) -> média verdict TR 9. Les états neutres 4 et 7 ne créent pas de faux verdict. Le chemin historique jaune ST peut passer 5 -> 3 -> 1 après son impact ; la restitution se fonde sur le dernier état décisif observé sans recalculer le gagnant.

Pendant `GAUGE_VERDICT`, l'état logique réel peut déjà être `indexa=1`, mais orbes, timers et gameplay restent gelés. Le lecteur montre `Stegtrexresultstegwin.mp4` ou `Stegtrexresulttrexwin.mp4` selon la décision déjà prise. L'EOS réel libère ensuite la présentation vers le PRE_ROUND ordinaire. L'EOS n'applique aucun dégât, aucun soin, aucun débit/crédit d'énergie et ne recalcule aucun gagnant.

TDD : run #57 sur le commit `ad62d52a5d91461cff4b54f5050a2fb2489888ca` a échoué exactement sur les quatre cas ST/TR rouge-bleu et ST/TR jaune parce que la phase observée restait PRE_ROUND. Correctif minimal : `02269f17ce0c9d00ac1aff1f08838d17a9175c6d`. Run Android #58 `37120140189` : 19 tests déterministes verts et APK Android produit. Cette preuve valide code/CI, pas encore le rendu et le son sur téléphone ; Fab doit valider les quatre cas réels.
''',
            'brainmap.md': r'''

## 2026-10-03 — JT-GAUGES-VERDICT-001 — cartographie technique

`JTPhaseController` conserve désormais un verrou de présentation `GAUGE_VERDICT`, distinct des états moteur. `GAUGE_WINNERS = {2: 9, 3: 8, 5: 8, 6: 9}` ne change jamais `engine["indexa"]` : la valeur 8/9 est un identifiant de scène vidéo seulement. `GAUGE_VERDICT` appartient aux phases gelées pour empêcher `carupdate`, `colvv` et les entrées gameplay pendant le résultat, sans appliquer le masque cinématique global utilisé par POWER/FINISH.

Flux rouge/bleu : 4 -> décision tactile -> 3(ST) ou 2(TR) -> moteur historique applique son impact -> fin logique vers 1 -> contrôleur met en file présentation 8(ST) ou 9(TR) -> EOS -> PRE_ROUND -> ROUND_ACTIVE. Flux jaune : 7 -> décision tactile -> 5(ST) ou 6(TR). Le chemin ST historique particulier peut faire 5 -> 3 -> 1 ; le dernier état décisif produit toujours le verdict ST de présentation. Le chemin TR fait 6 -> 1 puis verdict TR de présentation.

Le contrôleur média est enveloppé de façon ciblée : quand le moteur est déjà en 1 et qu'un verdict de jauge est en attente, `sync_scene_state` demande la scène 8/9 sans écrire 8/9 dans le moteur. L'EOS est protégé par identité du player et génération ; il marque le verdict terminé, arrête cette scène, puis la synchronisation normale reprend sur le vrai état moteur 1. Le menu 0 purge tout verdict en attente. Le chemin d'échec média reste borné et libère la logique sans restaurer une conséquence historique supplémentaire.

Aucune formule de score, seuil, dégâts, soin, énergie, probabilité IA ou coût de pouvoir n'est modifiée. Test de régression `test_decisive_gauges_present_verdict_before_orbs` couvre les quatre directions et vérifie : bon média, moteur déjà en 1, phase gelée, dégâts inchangés pendant la présentation, puis PRE_ROUND seulement après EOS.
''',
            'debughistorical.md': r'''

## 2026-10-03 — JT-GAUGES-VERDICT-001 — verdict escamoté après jauges

Observation Fab : après les séquences de jauges, la petite confrontation donnant explicitement « T-Rex win » ou « Steg win » n'était plus restituée et le déroulement repartait trop tôt vers la phase suivante.

Cause prouvée par lecture croisée du moteur historique, du main Android généré et du contrôleur 1.0.12 : les états jauge décisifs 2/3/5/6 calculent déjà le résultat et leurs conséquences, puis terminent en `indexa=1`. Le contrôleur voyait alors uniquement le nouvel état 1 et ouvrait PRE_ROUND. Les médias de verdict 8/9 étaient bien catalogués, mais aucun raccord de présentation ne les demandait depuis la sortie d'une jauge.

Contre-correctif explicitement rejeté : forcer réellement `indexa=8/9`. Ces états sont des résultats historiques de la comparaison des orbes et possèdent leurs propres impacts ; les réutiliser comme état moteur après la jauge aurait pu doubler les conséquences de combat.

Preuve TDD : commit test `ad62d52a5d91461cff4b54f5050a2fb2489888ca`, run #57 `37119715733`. Les quatre sous-cas attendus échouent avec `PRE_ROUND != GAUGE_VERDICT`, tandis que le reste de la suite demeure vert. Correctif `02269f17ce0c9d00ac1aff1f08838d17a9175c6d` : verdict uniquement dans la couche de présentation, moteur inchangé. Run #58 `37120140189` entièrement vert avec 19 tests et build Android réussi.

Reste à valider sur téléphone : visibilité/son réel des verdicts ST/TR après rouge-bleu et après jaune, absence d'orbes intercalés, reprise PRE_ROUND/ROUND correcte et absence de conséquence doublée. Le harness CI simule Kivy/décodeur ; il ne constitue pas une preuve de rendu matériel Android.
''',
            'todo.md': r'''

## 2026-10-03 — JT-GAUGES-VERDICT-001

- [x] Vérifier la base réelle avant intervention : `abc0701b21d4c7d37b5a2f11351483c725738802` au début de mission.
- [x] Distinguer les deux moteurs de jauge : rouge/bleu 2/3/4 et jaune 5/6/7.
- [x] Prouver la cause : sortie décisive vers `indexa=1` puis PRE_ROUND, sans demande du média verdict 8/9.
- [x] Écrire le test avant correction : commit `ad62d52a5d91461cff4b54f5050a2fb2489888ca`, run #57 rouge sur les quatre verdicts attendus.
- [x] Appliquer un correctif de présentation uniquement, sans faire exécuter les impacts historiques 8/9 : commit `02269f17ce0c9d00ac1aff1f08838d17a9175c6d`.
- [x] Vérifier ST/TR pour rouge-bleu et ST/TR pour jaune ; gel des timers/orbes, bon média, aucun dégât supplémentaire pendant le verdict, reprise PRE_ROUND à EOS.
- [x] Run Android #58 `37120140189` vert : 19 tests + build Android + upload APK.
- [x] Candidat produit : 📦 `JuneT-Rex-1.0.12-debug.apk`, versionCode 112, SHA-256 `fcab869588ee611947c2f262f8e0b76f4af86282342f857a04140ea34018697a`.
- [ ] Fab téléphone : valider rouge/bleu ST puis TR, jaune ST puis TR, le jaune uniquement dans son contexte de départage, aucun passage par les orbes pour décider le verdict, aucun double impact, chronos gelés jusqu'au bon raccord.
- [ ] Ne pas merger `main` et ne pas publier de release avant validation explicite de Fab.
''',
          }

          marker = 'JT-GAUGES-VERDICT-001'
          changed = []
          for filename, section in sections.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  print(f'[JT-MEMORY] skip {filename}: marker already present')
                  continue
              path.write_text(text.rstrip() + section + '\n', encoding='utf-8')
              changed.append(filename)
              print(f'[JT-MEMORY] appended {filename}')

          Path('/tmp/jt-memory-changed.txt').write_text('\n'.join(changed), encoding='utf-8')
          PY

      - name: Commit living-memory synchronization
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/jt-memory-changed.txt ]]; then
            echo 'No memory change required.'
            exit 0
          fi
          git config user.name 'greenpower2669'
          git config user.email '80179295+greenpower2669@users.noreply.github.com'
          git add brain.md brainmap.md debughistorical.md todo.md
          git commit -m 'docs: sync JT gauge verdict living memories'
          git push origin HEAD:port/android-first-apk
