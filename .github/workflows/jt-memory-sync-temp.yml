name: JT temporary memory sync

on:
  push:
    branches:
      - port/android-first-apk
    paths:
      - '.github/workflows/jt-memory-sync-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/android-first-apk
          fetch-depth: 0
      - name: Append living memories
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          payloads = {
              'brain.md': '',
              'brainmap.md': '',
              'debughistorical.md': '',
              'todo.md': '',
          }
          marker = 'JT-GAUGES-VERDICT-001'
          changed = []
          for filename, encoded in payloads.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  print(f'[JT-MEMORY] skip {filename}: marker already present')
                  continue
              section = base64.b64decode(encoded).decode('utf-8')
              path.write_text(text.rstrip() + '\n\n' + section, encoding='utf-8')
              changed.append(filename)
              print(f'[JT-MEMORY] appended {filename}')
          Path('/tmp/jt-memory-changed.txt').write_text('\n'.join(changed), encoding='utf-8')
          PY
      - name: Commit living-memory synchronization
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/jt-memory-changed.txt ]]; then
            echo 'No memory change required.'
            exit 0
          fi
          git config user.name 'greenpower2669'
          git config user.email '80179295+greenpower2669@users.noreply.github.com'
          git add brain.md brainmap.md debughistorical.md todo.md
          git commit -m 'docs: sync JT gauge verdict living memories'
          git push origin HEAD:port/android-first-apk
