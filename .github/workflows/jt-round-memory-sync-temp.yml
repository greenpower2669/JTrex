name: JT Round Memory Sync Temp

on:
  push:
    branches:
      - port/android-first-apk
    paths:
      - .github/workflows/jt-round-memory-sync-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/android-first-apk
          fetch-depth: 1

      - name: Append canonical KO-based round memory
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq 'JT-ROUNDS-KO-CANON-001' brain.md; then printf '%s' '' | base64 -d >> brain.md; fi
          if ! grep -Fq 'JT-ROUNDS-KO-CANON-001' brainmap.md; then printf '%s' '' | base64 -d >> brainmap.md; fi
          if ! grep -Fq 'JT-ROUNDS-KO-CANON-001' debughistorical.md; then printf '%s' '' | base64 -d >> debughistorical.md; fi
          if ! grep -Fq 'JT-ROUNDS-KO-CANON-001' todo.md; then printf '%s' '' | base64 -d >> todo.md; fi

      - name: Commit living memories only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "greenpower2669"
          git config user.email "80179295+greenpower2669@users.noreply.github.com"
          git add brain.md brainmap.md debughistorical.md todo.md
          if git diff --cached --quiet; then
            echo "No memory changes needed"
            exit 0
          fi
          git commit -m "docs: canonize KO-based JTrex round rules"
          git push origin HEAD:port/android-first-apk
