name: JT Round Memory Sync Temp

on:
  push:
    branches:
      - port/android-first-apk
    paths:
      - .github/workflows/jt-round-memory-sync-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/android-first-apk
          fetch-depth: 1

      - name: Append canonical KO-based round memory
        shell: bash
        run: |
          set -euo pipefail

          append_once() {
            file="$1"
            marker="$2"
            if grep -Fq "$marker" "$file"; then
              echo "$file already contains $marker"
              return
            fi
            cat >> "$file"
          }

          append_once brain.md "JT-ROUNDS-KO-CANON-001" <<'EOF'

## 2026-10-03 — JT-ROUNDS-KO-CANON-001 — règle canonique Fab

Cette décision remplace toute interprétation précédente où une victoire de jauge ou d'orbes attribuait directement un round.

- Un **round contient plusieurs fights** et se termine **uniquement quand la vie d'un dinosaure tombe à zéro**.
- Une victoire intermédiaire rouge/bleu, orbes, jaune ou pouvoir ne vaut jamais un round à elle seule : elle applique seulement ses conséquences historiques (dégâts/énergie/etc.).
- Au début d'un vrai round : annoncer `ROUND N`, puis lancer la charge rouge/bleu interactive.
- Rouge/bleu : Steg win ou T-Rex win applique son impact historique ; en égalité, les deux prennent l'impact historique puis jouer `assets/combat/Zerowinstegtrexsurleschargedejaugejauneetbleuetrouge.mp4`. Après le résultat, reprendre les orbes ; **aucun jaune immédiat**.
- L'impact partagé historique brut de 1 000 000 est réduit par la logique historique à **750 000 dégâts effectifs chacun** dans le chemin observé ; ne pas réécrire cette valeur arbitrairement.
- Après la phase d'orbes, lorsque la logique historique appelle la jauge jaune, afficher d'abord **`FIGHT!` en jaune** avec le même mécanisme de gel de présentation, puis lancer la jauge jaune.
- Le mécanisme actuel de gel des orbes reste distinct du vrai numéro de round et doit être conservé.
- Premier KO d'un match : allumer l'unique cercle visible du vainqueur, réinitialiser vies et disponibilité/utilisation des pouvoirs, annoncer `ROUND 2`, puis repartir par rouge/bleu.
- Après le deuxième round : si le même dinosaure gagne encore, il gagne la partie ; si l'autre gagne, son cercle s'allume aussi, réinitialiser vies/pouvoirs et annoncer `ROUND 3`.
- Le vainqueur du troisième round gagne la partie.
- Affichage : **un seul cercle par camp, deux cercles visibles au total**. Le nombre de rounds gagnés reste suivi en interne.
- Ne jamais lancer le finishing définitif au premier KO. La vidéo finale du vainqueur ne se joue qu'une fois la partie gagnée (2-0 ou 2-1), intégralement, puis retour accueil.
- Maintenir protections tactiles, gel des chronos et absence de double impact pendant annonces et vidéos de résultat.
- Le commit `6cfe746bf3d62f65d69d6212d44fd9fdcb0a4276` est une **tentative d'implémentation antérieure à cette précision KO** et son workflow #62 est en échec : ne pas le considérer comme validation de la règle canonique actuelle.
- Pour Astra : lecture directe du dépôt public par Internet sans API GitHub est explicitement autorisée pour l'audit. Astra raisonne et construit l'ordre de mission ; Sol modifie Git, teste, build et synchronise les mémoires.
EOF

          append_once brainmap.md "JT-ROUNDS-KO-CANON-001" <<'EOF'

## JT-ROUNDS-KO-CANON-001 — carte décisionnelle 2026-10-03

`MATCH`
→ `ROUND N` (N=1,2,3)
→ charge rouge/bleu
→ résultat `ST win | TR win | ZeroWin`
→ impacts historiques seulement, **pas de point de round**
→ orbes / fights successifs
→ si logique orbes appelle jaune : `FIGHT!` jaune → jauge jaune → résultat/impact
→ continuer les fights tant que ST et TR ont encore de la vie
→ **KO = seule fin de round**
→ incrémenter score interne du vainqueur + allumer son unique cercle visible
→ si vainqueur atteint 2 rounds : vidéo finale complète → accueil
→ sinon reset vies + pouvoirs → `ROUND N+1` → rouge/bleu.

Contraintes : 2 cercles visibles au total (1 ST, 1 TR), score de rounds interne ; rouge/bleu égalité = ZeroWin + dégâts aux deux puis orbes, jamais jaune direct ; impact partagé observé = 750 000 effectifs chacun après réduction historique ; gels/touches/chronos protégés pendant présentations.

ATTENTION : `6cfe746...` a été produit avant cette clarification KO et le run #62 échoue ; il ne doit pas servir de contrat fonctionnel.
EOF

          append_once debughistorical.md "JT-ROUNDS-KO-CANON-001" <<'EOF'

## 2026-10-03 — JT-ROUNDS-KO-CANON-001 — correction de compréhension

Cause de confusion identifiée : les termes `ROUND`, échange d'orbes, verdict 8/9 et jauges avaient été assimilés à tort.

Règle confirmée par Fab après vérification du jeu modèle :
- un round contient plusieurs fights ;
- seul un KO (vie à zéro) gagne le round ;
- 8/9, rouge/bleu et jaune sont des résultats intermédiaires qui infligent des dégâts mais n'attribuent pas un round ;
- égalité rouge/bleu : dégâts partagés + vidéo ZeroWin puis orbes ; pas de jauge jaune immédiate ;
- `FIGHT!` jaune est une annonce séparée qui précède la jauge jaune lorsqu'elle survient après la logique d'orbes ;
- un seul cercle visible par camp ; les deux cercles peuvent être allumés à 1-1 ; le deuxième succès d'un même camp est gardé en score interne et termine la partie ;
- premier KO : aucun finishing final, mais reset vies/pouvoirs puis nouveau ROUND ;
- victoire match 2-0 ou 2-1 : finishing intégral puis accueil.

Preuve moteur déjà observée : l'égalité de charge applique 1 000 000 brut aux deux puis la réduction ordinaire laisse 750 000 dégâts effectifs chacun. Le test doit valider le comportement effectif sans imposer 1 000 000 final.

Historique de travail : RED run #60 avait exposé l'absence de `ROUND_INTRO`, `FIGHT_INTRO`, `round_wins` et ZeroWin ; le commit d'implémentation `6cfe746bf3d62f65d69d6212d44fd9fdcb0a4276` a ensuite été construit sur une interprétation encore incorrecte où un résultat d'orbes pouvait scorer le round. Son run #62 est en échec. Il est donc **non canonique et non validé téléphone** pour la règle KO actuelle.
EOF

          append_once todo.md "JT-ROUNDS-KO-CANON-001" <<'EOF'

