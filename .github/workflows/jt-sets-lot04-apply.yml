name: Stage JT-SETS Lot04 Android Workflow Blob

on:
  push:
    branches:
      - tmp-jt-sets-lot04-apply
    paths:
      - '.github/workflows/jt-sets-lot04-apply.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout exact Lot04 base
        uses: actions/checkout@v4
        with:
          ref: e5c443df685060bec57d2d2f7b25ec9cff74e553
          path: base

      - name: Reconstruct exact Lot04 Android workflow
        shell: bash
        run: |
          set -euo pipefail
          cat control/temp/lot04/chunk-00.b64 control/temp/lot04/chunk-01.b64 control/temp/lot04/chunk-02.b64 control/temp/lot04/chunk-03.b64 > /tmp/jt-sets-lot04.patch.gz.b64
          echo 'b8871c45378d49bc2e78d31a351b5285ce389d53d271d33c1ce6f4848ca0176c  /tmp/jt-sets-lot04.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/jt-sets-lot04.patch.gz.b64 | gzip -dc > /tmp/jt-sets-lot04.patch
          echo '9030ed594c2081af614cc7001ad50621ed2bd0c358e84059680ccceb98b6426e  /tmp/jt-sets-lot04.patch' | sha256sum -c -
          cd base
          git apply --check /tmp/jt-sets-lot04.patch
          git apply /tmp/jt-sets-lot04.patch
          test "$(git hash-object .github/workflows/android.yml)" = 'b28f3f0be513dc8bed47c6d748eb7f630c24c3b1'
          echo '7c1ecf78f7481c463630178c6915ac88a3b0aad7b80c6ee1c3b246caca9b7566  .github/workflows/android.yml' | sha256sum -c -
          cp .github/workflows/android.yml ../control/temp/lot04/android-lot04.yml

      - name: Store exact workflow blob as ordinary temp file
        shell: bash
        working-directory: control
        run: |
          set -euo pipefail
          git config user.name 'greenpower2669'
          git config user.email '80179295+greenpower2669@users.noreply.github.com'
          git add temp/lot04/android-lot04.yml
          test "$(git hash-object temp/lot04/android-lot04.yml)" = 'b28f3f0be513dc8bed47c6d748eb7f630c24c3b1'
          git commit -m 'temp: stage exact Lot04 Android workflow blob'
          git push origin HEAD:tmp-jt-sets-lot04-apply
