name: Apply JT ORBS PRESENTATION 002

on:
  push:
    branches:
      - port/android-first-apk
    paths:
      - '.github/workflows/apply-jt-orbs-presentation-002.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/_apply_jt_orbs_presentation_002.py

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'greenpower2669'
          git config user.email '80179295+greenpower2669@users.noreply.github.com'
          git add tools/jtrex_phase_runtime.py tools/jtrex_media_runtime.py tools/prepare_android.py buildozer.spec .github/workflows/android.yml assets/combat/StegTrexPlageVideoenboucledesorbes.mp4
          git diff --cached --check
          git commit -m 'fix: reset new orb exchanges and loop beach background'
          git push origin HEAD:port/android-first-apk

