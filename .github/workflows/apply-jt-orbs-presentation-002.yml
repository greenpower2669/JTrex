name: Apply JT Beach Energy Canon 003

on:
  push:
    branches:
      - port/android-first-apk
    paths:
      - '.github/workflows/apply-jt-orbs-presentation-002.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical beach and energy reset
        run: python3 tools/_apply_jt_beach_energy_cleanup_003.py

      - name: Commit verified change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'greenpower2669'
          git config user.email '80179295+greenpower2669@users.noreply.github.com'
          git add -A \
            tools/jtrex_media_runtime.py \
            tools/jtrex_phase_runtime.py \
            tools/prepare_android.py \
            buildozer.spec \
            tests/test_orb_presentation.py \
            brain.md brainmap.md debughistorical.md todo.md ordres-de-mission.md \
            assets/combat/StegVsTrexvaetviensremolace.mp4 \
            assets/combat/StegVsTrexvaetviensremolacebisorigune.mp4
          git diff --cached --check
          git commit -m 'fix: use beach wait and reset round energy'
          git push origin HEAD:port/android-first-apk

# rerun after handing generated-engine tests to android.yml
