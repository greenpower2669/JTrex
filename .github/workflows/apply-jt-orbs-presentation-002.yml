name: Apply JT Beach Energy Canon 003

on:
  push:
    branches:
      - port/android-first-apk
    paths:
      - '.github/workflows/apply-jt-orbs-presentation-002.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical beach and energy reset
        run: python3 tools/_apply_jt_beach_energy_cleanup_003.py

      - name: Commit verified change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'greenpower2669'
          git config user.email '80179295+greenpower2669@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: use beach wait and reset round energy'
          git push origin HEAD:port/android-first-apk

# rerun after memory EOF normalization
