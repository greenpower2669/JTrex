name: Apply JT Beach Required Resource Fix

on:
  push:
    branches:
      - port/android-first-apk
    paths:
      - '.github/workflows/apply-jt-orbs-presentation-002.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace stale required wait resource
        run: python3 tools/_fix_beach_required_resource.py

      - name: Commit verified change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'greenpower2669'
          git config user.email '80179295+greenpower2669@users.noreply.github.com'
          git add tools/prepare_android.py
          git diff --cached --check
          git commit -m 'fix: require beach wait resource'
          git push origin HEAD:port/android-first-apk
