name: Apply JT-SETS-001 Lot02 v4

on:
  push:
    branches:
      - feature/dinosaur-sets-v1
    paths:
      - '.github/workflows/jt-sets-lot02-apply-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout mission branch
        uses: actions/checkout@v4
        with:
          ref: feature/dinosaur-sets-v1
          fetch-depth: 0

      - name: Reconstruct and apply verified Lot02 patch
        shell: bash
        run: |
          set -euo pipefail
          cat docs/jt-sets-001/lot02-v4-00.b64 \
              docs/jt-sets-001/lot02-v4-01.b64 \
              docs/jt-sets-001/lot02-v4-02.b64 \
              docs/jt-sets-001/lot02-v4-03.b64 > /tmp/lot02.b64
          echo 'f8b85666b78d0591a2946ea0a5b71be951ae8d40e306ee5a76235f6920064061  /tmp/lot02.b64' | sha256sum -c -
          base64 -d /tmp/lot02.b64 | gzip -d > /tmp/lot02.patch
          test "$(grep -c '^diff --git ' /tmp/lot02.patch)" = 15
          git apply --check /tmp/lot02.patch
          git apply /tmp/lot02.patch
          test -f tools/jtrex_sets_runtime.py
          test -f assets/sets/catalog.json
          test -f assets/sets/trex_vs_steg/manifest.json
          test -f tests/test_sets_runtime.py
          test -f tests/test_sets_packaging.py
          test -f tests/test_sets_media_resolution.py
          test -f tests/test_android_set_workflow_contract.py
          rm -f docs/jt-sets-001/lot02-v4-*.b64
          rm -f docs/jt-sets-001/lot02-integrated.patch.gz.b64
          rm -f docs/jt-sets-001/lot02-newfiles.patch.gz.b64
          rm -f .github/workflows/jt-sets-lot02-apply.yml
          rm -f .github/workflows/jt-sets-dev-snapshot.yml
          rm -f .github/workflows/jt-sets-lot02-apply-v4.yml
          git diff --check
          git status --short

      - name: Generate canonical app and run full suite
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output JuneTrex.zip \
            'https://github.com/greenpower2669/JTrex/releases/download/JTrex/JuneTrex.zip'
          test "$(stat -c%s JuneTrex.zip)" = 327992765
          echo 'f73ca1fd5e96ca6e11df5987bda8b2e59ebac26b1beb23fe34883b15bee66647  JuneTrex.zip' | sha256sum -c -
          rm -rf app
          python3 tools/prepare_android.py --archive JuneTrex.zip --output app --spec buildozer.spec
          python3 -m unittest discover -s tests -v
          python3 -m py_compile tools/jtrex_sets_runtime.py tools/jtrex_media_runtime.py tools/jtrex_phase_runtime.py tools/prepare_android.py
          test -f app/jtrex_sets_runtime.py
          test -f app/assets/sets/catalog.json
          test -f app/assets/sets/trex_vs_steg/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('app/android-preparation.json').read_text(encoding='utf-8'))
          assert report['canonical_set_id'] == 'trex_vs_steg'
          assert report['canonical_set_asset_count'] == 41
          assert len(report['canonical_manifest_sha256']) == 64
          assert len(report['canonical_set_assets']) == 41
          print('JT-SETS Lot02 prepare evidence:', report['canonical_set_id'], report['canonical_set_asset_count'])
          PY
          rm -rf app JuneTrex.zip

      - name: Commit integrated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'greenpower2669'
          git config user.email '80179295+greenpower2669@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'feat: resolve canonical JTrex set media from manifest'
          git push origin HEAD:feature/dinosaur-sets-v1
