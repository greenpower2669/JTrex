name: Reconstruct exact JT-SETS Android workflow blob

on:
  push:
    branches:
      - feature/dinosaur-sets-v1
    paths:
      - '.github/workflows/jt-sets-android-blob.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blob:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: feature/dinosaur-sets-v1
          fetch-depth: 0

      - name: Reconstruct exact android.yml and create Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit=4a5809ef22ad222dfa1cb19e6f6b76554b0d33be
          for part in 00a 00b 00c 01 02 03; do
            git show "${source_commit}:docs/jt-sets-001/lot02-v4-${part}.b64"
          done > /tmp/lot02.b64
          echo 'f8b85666b78d0591a2946ea0a5b71be951ae8d40e306ee5a76235f6920064061  /tmp/lot02.b64' | sha256sum -c -
          base64 -d /tmp/lot02.b64 | gzip -d > /tmp/lot02.patch
          git show "${source_commit}^:.github/workflows/android.yml" > .github/workflows/android.yml
          git apply --include=.github/workflows/android.yml /tmp/lot02.patch
          echo '3f4a83e9a0c35f7f361917fdbacfe6cadf3c41369519e0dcfc6a2a764bf00b13  .github/workflows/android.yml' | sha256sum -c -
          python3 - <<'PY' > /tmp/blob.json
          import base64, json
          from pathlib import Path
          raw = Path('.github/workflows/android.yml').read_bytes()
          print(json.dumps({'content': base64.b64encode(raw).decode('ascii'), 'encoding': 'base64'}))
          PY
          response="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --data-binary @/tmp/blob.json)"
          echo "$response"
          python3 - <<'PY' "$response"
          import json, sys
          obj = json.loads(sys.argv[1])
          sha = obj['sha']
          print(f'EXACT_ANDROID_BLOB_SHA={sha}')
          PY
