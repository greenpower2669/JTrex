name: JT assets light size guard patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jt-assets-light-size-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update only the two media size guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/prepare_android.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"assets/combat/Chargestegtrexchargerougebleucorrected.mp4": 746721,':
                  '"assets/combat/Chargestegtrexchargerougebleucorrected.mp4": 833378,',
              '"assets/powers/trph-phoenix-attack.mp4": 2379231,':
                  '"assets/powers/trph-phoenix-attack.mp4": 1945922,',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit minimal guard update and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/jt-assets-light-size-guard.yml
          git add tools/prepare_android.py
          git diff --cached --check
          git diff --cached -- tools/prepare_android.py
          git commit -m 'JT-ASSETS-LIGHT-001: update media size guards'
          git push origin HEAD:main
