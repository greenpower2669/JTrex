name: Fix orb legacy validator

on:
  push:
    branches:
      - port/android-first-apk
    paths:
      - .github/workflows/fix-orb-legacy-validator.yml

permissions:
  contents: write

jobs:
  patch-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Narrow legacy wait guard to the active wait scene
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          needle = 'if "StegVsTrexvaetviensremolace" in runtime:'
          hits = [i for i, line in enumerate(lines) if line.strip() == needle]
          if len(hits) != 1:
              raise SystemExit(f'expected one stale legacy guard, found {len(hits)}')
          i = hits[0]
          if i + 1 >= len(lines) or 'retired wait media still referenced by runtime' not in lines[i + 1]:
              raise SystemExit('stale legacy guard raise line not found next to condition')
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i:i + 2] = [
              indent + 'wait_scene = runtime.split(\'"wait": {\', 1)[1].split(\'"charge": {\', 1)[0]',
              indent + 'if "StegVsTrexvaetviensremolace" in wait_scene:',
              indent + '    raise SystemExit("retired wait media is still active in SCENES[\'wait\']")',
          ]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Commit validator fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'greenpower2669'
          git config user.email '80179295+greenpower2669@users.noreply.github.com'
          git add .github/workflows/android.yml
          git rm .github/workflows/fix-orb-legacy-validator.yml
          git diff --cached --check
          git commit -m 'ci: allow declared legacy orb fallback'
          git push origin HEAD:port/android-first-apk
