name: Sync orb canon memories

on:
  push:
    branches:
      - port/android-first-apk
    paths:
      - '.github/workflows/sync-orb-canon-memories.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append canonical closure to living memories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          marker = '## 2026-10-04 — JT-ORBS-PRESENTATION-002 / JT-BEACH-ENERGY-CANON-003 — CANON ACTIF'
          common = base64.b64decode('').decode('utf-8')
          todo = base64.b64decode('').decode('utf-8')
          todo_marker = '### TODO téléphone restant — JT-BEACH-ENERGY-CANON-003'
          for name in ['ordres-de-mission.md', 'brain.md', 'brainmap.md', 'debughistorical.md', 'todo.md']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  text = text.rstrip() + '\n\n' + common.rstrip() + '\n'
              if name == 'todo.md' and todo_marker not in text:
                  text = text.rstrip() + '\n\n' + todo.rstrip() + '\n'
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit living-memory sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'greenpower2669'
          git config user.email '80179295+greenpower2669@users.noreply.github.com'
          git add ordres-de-mission.md brain.md brainmap.md debughistorical.md todo.md
          if git diff --cached --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git commit -m 'docs: canonize orb beach and round energy rules'
          git push origin HEAD:port/android-first-apk
