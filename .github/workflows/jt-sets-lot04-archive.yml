name: JT-SETS Lot04 Historical Archive

on:
  push:
    paths:
      - '.github/workflows/jt-sets-lot04-archive.yml'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and verify historical archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output JuneTrex.zip \
            'https://github.com/greenpower2669/JTrex/releases/download/JTrex/JuneTrex.zip'
          test "$(stat -c %s JuneTrex.zip)" = "327992765"
          echo 'f73ca1fd5e96ca6e11df5987bda8b2e59ebac26b1beb23fe34883b15bee66647  JuneTrex.zip' | sha256sum -c -
      - name: Upload verified historical archive
        uses: actions/upload-artifact@v4
        with:
          name: JT-SETS-Lot04-JuneTrex
          path: JuneTrex.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
